<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDEA9103 - Awakening Heaven</title>
  <link rel="stylesheet" href="style.css">

  <!-- Center the canvas (written here so it works even if style.css is empty) -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: rgb(40, 32, 28);
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
    }
  </style>

  <!-- p5.js 1.9.4 (preload does not work in 2.0+) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <!-- p5.sound: needed for Yuanze's audio part -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/addons/p5.sound.min.js"></script>
</head>
<body>
  <!-- Order matters: sketch.js first, then perlin-noise.js -->
  <script src="sketch.js"></script>
  <script src="perlin-noise.js"></script>
</body>
</html>
