<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDEA9103 - Awakening Heaven</title>
  
  <!-- Load p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: rgb(40, 32, 28);
      overflow: hidden; /* Prevent scrollbars */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      cursor: none; /* Junyu: hide default cursor */
    }
    #audio-story-hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(90vw, 760px);
      margin: 0;
      padding: 10px 18px;
      box-sizing: border-box;
      text-align: center;
      color: rgba(245, 233, 214, 0.94);
      background: rgba(27, 20, 18, 0.62);
      border: 1px solid rgba(255, 230, 190, 0.18);
      border-radius: 12px;
      backdrop-filter: blur(2px);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(12px, 1.1vw, 20px);
      letter-spacing: 0.12em;
      line-height: 1.5;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 10;
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- 1. Hint container required by Yuanze's audio module -->
  <p id="audio-story-hint" role="status" aria-live="polite">Move the mouse to wake up the scroll, then click on the Heavenly Bell to listen.</p>

  <!-- 2. Load each team member's JavaScript module in order -->
  <script src="audio-change.js"></script> <!-- Yuanze: Audio & Dragon -->
  <script src="timebase-2.js"></script>   <!-- Haocheng: Bottom Time Effects & Background -->
  <script src="timebase-1.js"></script>   <!-- Haocheng: Top Sun & Moon Cycle -->
  <script src="user-input.js"></script>   <!-- Junyu: User Input & Lantern -->
  <script src="sketch.js"></script>       <!-- Main Dispatcher -->
  <script src="perlin-noise.js"></script> <!-- Kristen: Fog & Clouds (must load last) -->
</body>
</html>
