<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDEA9103 - Awakening Heaven</title>
  <link rel="stylesheet" href="style.css">

  <!-- Center the canvas (written here so it works even if style.css is empty) -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: rgb(40, 32, 28);
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
    }
  </style>

  <!-- Local p5 core; audio-change.js uses the native Web Audio API. -->
  <script src="libraries/p5.min.js"></script>
</head>
<body>
  <!-- Order matters: sketch.js first, then perlin-noise.js -->
  <p id="audio-story-hint" role="status" aria-live="polite">移动鼠标唤醒画卷，再点击天钟聆听</p>
  <script src="audio-change.js"></script>
  <script src="sketch.js"></script>
  <script src="perlin-noise.js"></script>
</body>
</html>
